name: Build (Linux host)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  LIBNAME: godot-doom-node

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: linux
            arch: x86_64
          - platform: windows
            arch: x86_64
        target-type: [template_debug, template_release]
        float-precision: [single]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            scons \
            pkg-config \
            fluidsynth \
            libfluidsynth-dev \
            libsdl2-dev \
            mingw-w64

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target.platform }}" = "windows" ]; then
            scons \
              platform=windows \
              arch=x86_64 \
              target=${{ matrix.target-type }} \
              precision=${{ matrix.float-precision }} \
              use_mingw=yes \
              pkg_config_path="$PKG_CONFIG_PATH"
          else
            scons \
              platform=linux \
              arch=x86_64 \
              target=${{ matrix.target-type }} \
              precision=${{ matrix.float-precision }}
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LIBNAME }}-${{ matrix.target.platform }}-${{ matrix.target-type }}
          path: |
            addons/**
